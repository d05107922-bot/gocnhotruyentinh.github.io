<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Góc Nhỏ Truyện Tình | Moonlight Edition</title>
<link rel="icon" href="data:,">

<style>
/* ===== THEME VARIABLES - MOONLIGHT SYSTEM ===== */
:root {
  --primary-gold: #d4af37; /* Màu vàng Gold sang trọng */
  --gold-glow: rgba(212, 175, 55, 0.4);
  --bg-dark: #050a15;
  --bg-gradient: radial-gradient(circle at center, #0f172a, #050a15);
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-hover: rgba(255, 255, 255, 0.1);
  --text-white: #f8fafc;
  --text-dim: #94a3b8;
  --accent-blue: #38bdf8;
}

/* ===== BASE ===== */
body {
  margin: 0;
  font-family: 'Quicksand', 'Segoe UI', sans-serif; /* Font mềm mại hơn */
  background: var(--bg-gradient) fixed !important;
  color: var(--text-white);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { 
  background: var(--primary-gold); 
  border-radius: 10px; 
}

/* ===== HEADER (GLASSMORPHISM) ===== */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(5, 10, 21, 0.8);
  backdrop-filter: blur(15px);
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(212, 175, 55, 0.2);
}
header h1 {
  margin: 0;
  font-size: 1.6em;
  font-weight: 300;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: linear-gradient(to right, #fff, var(--primary-gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.menu-btn {
  background: none;
  border: 1px solid var(--primary-gold);
  color: var(--primary-gold);
  width: 45px;
  height: 45px;
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2em;
}
.menu-btn:hover {
  background: var(--primary-gold);
  color: var(--bg-dark);
  box-shadow: 0 0 15px var(--gold-glow);
}

/* ===== DROPDOWN MENU ===== */
#nav-menu {
  position: fixed;
  top: 80px;
  right: 20px;
  width: 280px;
  background: rgba(15, 23, 42, 0.95);
  border: 1px solid var(--primary-gold);
  border-radius: 20px;
  display: none;
  z-index: 9999;
  overflow: hidden;
  animation: slideIn 0.3s ease-out;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
#nav-menu a {
  display: block;
  padding: 15px 25px;
  color: var(--text-white);
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  transition: 0.3s;
}
#nav-menu a:hover {
  background: var(--card-hover);
  color: var(--primary-gold);
  padding-left: 35px;
}

/* ===== SEARCH BOX ===== */
.search-box { padding: 15px; }
.search-box input {
  width: 100%;
  padding: 10px 15px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(212, 175, 55, 0.3);
  border-radius: 25px;
  color: white;
  outline: none;
}
.search-box input:focus { border-color: var(--primary-gold); }

/* ===== GRID & CARDS ===== */
.container {
  max-width: 1400px;
  margin: auto;
  padding: 40px 20px;
}
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 30px;
}
.story-card {
  background: var(--card-bg);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.story-card:hover {
  transform: translateY(-12px);
  border-color: var(--primary-gold);
  box-shadow: 0 15px 30px rgba(0,0,0,0.5);
  background: var(--card-hover);
}
.story-card img {
  width: 100%;
  height: 350px;
  object-fit: cover;
  filter: grayscale(20%);
  transition: 0.5s;
}
.story-card:hover img {
  filter: grayscale(0%);
  transform: scale(1.05);
}
.story-info { padding: 20px; text-align: center; }
.story-info h3 {
  margin: 0;
  font-size: 1.1em;
  font-weight: 500;
  color: var(--primary-gold);
}
.story-info p {
  margin: 8px 0 0;
  font-size: 0.85em;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ===== ADD BUTTON ===== */
.add-btn {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 60px;
  height: 60px;
  background: var(--primary-gold);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--bg-dark);
  text-decoration: none;
  font-size: 24px;
  box-shadow: 0 0 20px var(--gold-glow);
  z-index: 1000;
  transition: 0.3s;
}
.add-btn:hover { transform: rotate(90deg) scale(1.1); }

/* ===== STAR ANIMATION ===== */
#star-container {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0;
  animation: twinkle var(--duration) infinite ease-in-out;
}
@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50% { opacity: var(--max-opacity); transform: scale(1.2); }
}

/* ===== RESPONSIVE ===== */
@media(max-width: 768px) {
  .story-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
  .story-card img { height: 260px; }
}
</style>
</head>

<body>

<div id="star-container"></div>

<header>
  <h1>🌙 Moonlit Tales</h1>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
</header>

<nav id="nav-menu">
  <div class="search-box">
    <input type="text" id="search-input" placeholder="Tìm tên truyện...">
  </div>
  <a href="index.html">✦ Trang chủ</a>
  <a href="upload.html">✦ Đăng truyện</a>
  <a href="https://www.facebook.com/profile.php?id=61575487573210" target="_blank">✦ Liên hệ</a>
</nav>

<div class="container">
  <div id="story-list" class="story-grid">
    <div class="loading">✨ Đang đọc bầu trời sao...</div>
  </div>
</div>

<a href="upload.html" class="add-btn" title="Thêm truyện">+</a>

<script>
// Toggle Menu
function toggleMenu() {
  const nav = document.getElementById('nav-menu');
  nav.style.display = (nav.style.display === 'block') ? 'none' : 'block';
}

document.addEventListener('click', (e) => {
  const nav = document.getElementById('nav-menu');
  const btn = document.querySelector('.menu-btn');
  if (nav.style.display === 'block' && !nav.contains(e.target) && !btn.contains(e.target)) {
    nav.style.display = 'none';
  }
});

// Load Stories
let stories = [];
const list = document.getElementById('story-list');
const input = document.getElementById('search-input');

fetch('stories.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    stories = data;
    render(stories);
  })
  .catch(() => list.innerHTML = '<div class="no-result">Lỗi kết nối với bầu trời đêm 🌌</div>');

function render(data) {
  list.innerHTML = '';
  if (data.length === 0) {
    list.innerHTML = '<div class="no-result">Chưa có ngôi sao nào tỏa sáng ở đây...</div>';
    return;
  }
  data.forEach(s => {
    const div = document.createElement('div');
    div.className = 'story-card';
    div.onclick = () => location.href = `story.html?id=${s.id}`;
    div.innerHTML = `
      <img src="${s.thumbnail}" alt="${s.title}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=500&q=60'">
      <div class="story-info">
        <h3>${s.title}</h3>
        <p>${s.author || 'Vô danh'}</p>
      </div>
    `;
    list.appendChild(div);
  });
}

// Search
input?.addEventListener('input', () => {
  const q = input.value.trim().toLowerCase();
  render(stories.filter(s => 
    s.title.toLowerCase().includes(q) || (s.author && s.author.toLowerCase().includes(q))
  ));
});

// Star Animation (Thay thế cánh hoa)
function createStars() {
  const container = document.getElementById('star-container');
  const count = 80;
  for (let i = 0; i < count; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 3 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
    star.style.setProperty('--max-opacity', Math.random() * 0.7 + 0.3);
    container.appendChild(star);
  }
}
createStars();
</script>

</body>
</html>
